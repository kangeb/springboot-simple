spring.main.sources = com.example.simple

spring.mvc.throw-exception-if-no-handler-found=true

# 启用静态资源映射（Swagger UI需要）
spring.resources.add-mappings=true

logging.config=classpath:logback.xml

welcome = Hello World!
#tomcat
server.port = 8080
#mysql
spring.datasource.url=jdbc:mysql://192.168.2.118:3306/ssm?useUnicode=true&characterEncoding=UTF-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# MyBatis XML配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.simple.domain

# REDIS (RedisProperties)
# Redis数据库索引（默认为0）
spring.redis.database=0
# Redis服务器地址
spring.redis.host=192.168.2.118
# Redis服务器连接端口
spring.redis.port=6379
# Redis服务器连接密码（默认为空）
spring.redis.password=123456
# 连接超时时间（毫秒）
spring.redis.timeout=30s

logging.level.com.example.simple.Mapper=DEBUG
logging.level.com.example.simple.controller=DEBUG
